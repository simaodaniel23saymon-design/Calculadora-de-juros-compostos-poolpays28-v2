<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora jurosPooolpays</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="language-selector">
        <button id="language-btn"><img id="flag-icon" src="https://flagcdn.com/w20/br.png" alt="flag"></button>
        <div id="language-menu" class="hidden">
            <img src="https://flagcdn.com/w20/br.png" alt="Português (Brasil)" onclick="changeLanguage('pt-BR')">
            <img src="https://flagcdn.com/w20/gb.png" alt="English" onclick="changeLanguage('en')">
            <img src="https://flagcdn.com/w20/es.png" alt="Español" onclick="changeLanguage('es')">
            <img src="https://flagcdn.com/w20/in.png" alt="हिन्दी" onclick="changeLanguage('hi')">
        </div>
    </div>

    <div class="calculator-container">
        <h1 id="title">Calculadora jurosPooolpays</h1>
        
        <div class="input-group">
            <label for="capital" id="label-capital">Capital Inicial ($):</label>
            <input type="number" id="capital" placeholder="Ex: 1000.00" min="0.01" step="0.01" required>
        </div>

        <div class="input-group">
            <label for="ciclo" id="label-ciclo">Escolha o Ciclo de Aporte:</label>
            <select id="ciclo">
                <option value="1-0.005">Ciclo 1 Dia (0.5%)</option>
                <option value="5-0.03">Ciclo 5 Dias (3%)</option>
                <option value="10-0.07">Ciclo 10 Dias (7%)</option>
                <option value="20-0.18">Ciclo 20 Dias (18%)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="repeticoes" id="label-repeticoes">Quantas vezes repetir o ciclo:</label>
            <input type="number" id="repeticoes" placeholder="Ex: 5" min="1" required>
        </div>

        <button id="calcular-btn" onclick="calcularJurosPooolpays()">Calcular Rendimento</button>

        <div id="resultado" class="resultado-area">
            Preencha os campos e clique em Calcular.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
