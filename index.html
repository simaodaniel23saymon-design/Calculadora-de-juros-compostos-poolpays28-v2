<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compound Interest — Calculadora Pooolpays</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top bar: language flag (single) and YouTube button -->
  <div class="topbar">
    <button id="lang-toggle" class="lang-single" aria-haspopup="true" aria-expanded="false" title="Mudar idioma">🇧🇷</button>
    <div id="lang-menu" class="lang-menu" role="menu" aria-hidden="true">
      <button class="lang-item" data-lang="pt-BR">🇧🇷 Português (BR)</button>
      <button class="lang-item" data-lang="en">🇬🇧 English</button>
      <button class="lang-item" data-lang="es">🇪🇸 Español</button>
      <button class="lang-item" data-lang="hi">🇮🇳 हिन्दी</button>
    </div>

    <a id="yt-link" class="yt-button" href="https://youtube.com/@granasemterno?si=vgbvvOTORxD6dYqC" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path fill="#fff" d="M23.5 6.2s-.2-1.7-.8-2.4c-.8-.9-1.7-.9-2.1-1C16.6 2.4 12 2.4 12 2.4s-4.6 0-8.6.4c-.5 0-1.4 0-2.1 1C.7 4.5.5 6.2.5 6.2S.2 8 .2 9.9v.2C.2 12.7.5 14.6.5 14.6s.2 1.7.8 2.4c.8.9 1.9.9 2.4 1 1.8.2 7.4.4 7.4.4s4.6 0 8.6-.4c.5 0 1.4 0 2.1-1 .6-.7.8-2.4.8-2.4s.3-2 .3-3.9v-.2c0-1.9-.3-3.7-.3-3.7z"></path>
        <path fill="#ff0000" d="M9.8 15.5V8.6l6.1 3.4-6.1 3.5z"></path>
      </svg>
    </a>
  </div>

  <main class="container">
    <div class="card">
      <header class="card-header">
        <h1 id="title">Calculadora Pooolpays</h1>
        <p id="subtitle" class="muted">Calcule rendimentos com ciclos compostos</p>
      </header>

      <div class="form">
        <label for="capital" id="label-capital">Initial Capital ($):</label>
        <input type="number" id="capital" placeholder="Ex: 1000.00" min="0.01" step="0.01" />

        <label for="ciclo" id="label-ciclo">Choose Contribution Cycle:</label>
        <select id="ciclo">
          <option value="1-0.005">1 day (0.5%)</option>
          <option value="5-0.03">5 days (3%)</option>
          <option value="10-0.07">10 days (7%)</option>
          <option value="20-0.18">20 days (18%)</option>
        </select>

        <label for="repeticoes" id="label-rep">How many times to repeat this cycle?</label>
        <input type="number" id="repeticoes" placeholder="Ex: 3" min="1" step="1" value="1"/>

        <button id="calc-btn" class="primary" type="button">Calculate Return</button>

        <div id="resultado" class="resultado-area" aria-live="polite">
          Fill the fields and click Calculate.
        </div>
      </div>

      <footer class="card-footer muted small">
        <span id="note">Calculation based on complete cycles.</span>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
